name: Task execution spike

on:
  pull_request:
    paths:
      - '.github/workflows/task-execution-spike.yml'
      - '.gitignore'
      - '.vscodeignore'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'
      - 'spike/**'
      - 'test/**'
      - 'tsconfig*.json'
      - 'esbuild.mjs'
  workflow_dispatch:

jobs:
  desktop-task-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check-types
      - run: npm run compile
      - run: npm run compile-tests
      - name: Run VS Code task smoke tests
        if: runner.os != 'Linux'
        run: npm test
      - name: Run VS Code task smoke tests on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
